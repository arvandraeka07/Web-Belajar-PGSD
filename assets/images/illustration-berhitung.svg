<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 400" role="img" aria-label="Ilustrasi belajar berhitung">
  <defs>
    <linearGradient id="mathBg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fff8dc"/>
      <stop offset="1" stop-color="#ffefb8"/>
    </linearGradient>
    <linearGradient id="abacusFrame" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffb45e"/>
      <stop offset="1" stop-color="#e07a16"/>
    </linearGradient>
    <linearGradient id="blockBlue" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#6bb0ff"/>
      <stop offset="1" stop-color="#2f7bf6"/>
    </linearGradient>
    <linearGradient id="blockOrange" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffbe74"/>
      <stop offset="1" stop-color="#ff9a3c"/>
    </linearGradient>
    <linearGradient id="blockGreen" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#5ee3a5"/>
      <stop offset="1" stop-color="#2ecf7e"/>
    </linearGradient>
    <filter id="mathShadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="6" stdDeviation="6" flood-color="#b07c00" flood-opacity="0.12"/>
    </filter>
  </defs>

  <ellipse cx="320" cy="216" rx="272" ry="158" fill="url(#mathBg)" opacity="0.9"/>
  <circle cx="116" cy="104" r="52" fill="#ffffff" opacity="0.5"/>
  <circle cx="536" cy="300" r="64" fill="#ffffff" opacity="0.4"/>
  <path d="M78 320c26-18 56-16 74 2" fill="none" stroke="#f0cd72" stroke-width="4" stroke-linecap="round"/>

  <!-- Menara balok angka -->
  <g filter="url(#mathShadow)">
    <rect x="168" y="284" width="108" height="66" rx="14" fill="url(#blockGreen)" stroke="#159a58" stroke-width="4"/>
    <text x="222" y="334" font-family="'Baloo 2','Trebuchet MS',sans-serif" font-size="44" font-weight="800" text-anchor="middle" fill="#ffffff">3</text>
    <rect x="196" y="226" width="86" height="58" rx="13" fill="url(#blockOrange)" stroke="#d96c0c" stroke-width="4"/>
    <text x="239" y="270" font-family="'Baloo 2','Trebuchet MS',sans-serif" font-size="40" font-weight="800" text-anchor="middle" fill="#ffffff">2</text>
    <rect x="218" y="176" width="64" height="50" rx="12" fill="url(#blockBlue)" stroke="#1a56c4" stroke-width="4"/>
    <text x="250" y="214" font-family="'Baloo 2','Trebuchet MS',sans-serif" font-size="36" font-weight="800" text-anchor="middle" fill="#ffffff">1</text>
  </g>

  <!-- Sempoa -->
  <g filter="url(#mathShadow)">
    <rect x="392" y="120" width="196" height="190" rx="20" fill="url(#abacusFrame)" stroke="#b9600a" stroke-width="4"/>
    <rect x="408" y="138" width="164" height="154" rx="12" fill="#fff9ea" stroke="#c97720" stroke-width="3"/>
    <g stroke="#d99a4e" stroke-width="5" stroke-linecap="round">
      <path d="M420 168h140M420 204h140M420 240h140M420 276h140"/>
    </g>
    <g stroke="#ffffff" stroke-width="2" opacity="0.5">
      <path d="M420 166h140M420 202h140M420 238h140M420 274h140"/>
    </g>
    <g>
      <circle cx="444" cy="168" r="12" fill="#2f7bf6" stroke="#1a56c4" stroke-width="3"/><circle cx="474" cy="168" r="12" fill="#ffd23f" stroke="#e2a800" stroke-width="3"/><circle cx="504" cy="168" r="12" fill="#2ecf7e" stroke="#159a58" stroke-width="3"/><circle cx="534" cy="168" r="12" fill="#ff9a3c" stroke="#d96c0c" stroke-width="3"/>
      <circle cx="444" cy="204" r="12" fill="#ff9a3c" stroke="#d96c0c" stroke-width="3"/><circle cx="474" cy="204" r="12" fill="#8b5cf6" stroke="#6533d8" stroke-width="3"/><circle cx="504" cy="204" r="12" fill="#2f7bf6" stroke="#1a56c4" stroke-width="3"/><circle cx="534" cy="204" r="12" fill="#ffd23f" stroke="#e2a800" stroke-width="3"/>
      <circle cx="444" cy="240" r="12" fill="#2ecf7e" stroke="#159a58" stroke-width="3"/><circle cx="474" cy="240" r="12" fill="#ffd23f" stroke="#e2a800" stroke-width="3"/><circle cx="504" cy="240" r="12" fill="#8b5cf6" stroke="#6533d8" stroke-width="3"/><circle cx="534" cy="240" r="12" fill="#ff9a3c" stroke="#d96c0c" stroke-width="3"/>
      <circle cx="444" cy="276" r="12" fill="#2f7bf6" stroke="#1a56c4" stroke-width="3"/><circle cx="474" cy="276" r="12" fill="#2ecf7e" stroke="#159a58" stroke-width="3"/><circle cx="504" cy="276" r="12" fill="#ff9a3c" stroke="#d96c0c" stroke-width="3"/><circle cx="534" cy="276" r="12" fill="#ffd23f" stroke="#e2a800" stroke-width="3"/>
    </g>
  </g>

  <!-- Simbol matematika -->
  <g font-family="'Baloo 2','Trebuchet MS',sans-serif" font-weight="800" text-anchor="middle">
    <circle cx="112" cy="188" r="37" fill="#2f7bf6" stroke="#1a56c4" stroke-width="4"/>
    <text x="112" y="205" font-size="48" fill="#ffffff">+</text>
    <circle cx="352" cy="92" r="31" fill="#ff9a3c" stroke="#d96c0c" stroke-width="4"/>
    <text x="352" y="105" font-size="40" fill="#ffffff">−</text>
    <circle cx="556" cy="80" r="29" fill="#2ecf7e" stroke="#159a58" stroke-width="4"/>
    <text x="556" y="93" font-size="38" fill="#ffffff">=</text>
    <circle cx="92" cy="288" r="26" fill="#8b5cf6" stroke="#6533d8" stroke-width="4"/>
    <text x="92" y="300" font-size="34" fill="#ffffff">×</text>
  </g>

  <!-- Bintang -->
  <g fill="#ffd23f">
    <path d="m366 322 4 8.2 9 1.3-6.5 6.3 1.6 8.9-8.1-4.2-8.1 4.2 1.6-8.9-6.5-6.3 9-1.3z" stroke="#e2a800" stroke-width="2"/>
    <path d="m592 172 3 6.2 6.8 1-4.9 4.7 1.2 6.7-6.1-3.2-6.1 3.2 1.2-6.7-4.9-4.7 6.8-1z" opacity="0.9"/>
    <circle cx="300" cy="132" r="4"/>
    <circle cx="576" cy="236" r="4"/>
  </g>
</svg>
