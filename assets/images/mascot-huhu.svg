<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 260 300" role="img" aria-label="Huhu si burung hantu">
  <defs>
    <linearGradient id="huhuBody" x1="0.2" y1="0" x2="0.85" y2="1">
      <stop offset="0" stop-color="#6bb0ff"/>
      <stop offset="0.55" stop-color="#3b86f7"/>
      <stop offset="1" stop-color="#1f5fcf"/>
    </linearGradient>
    <linearGradient id="huhuWing" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2f7bf6"/>
      <stop offset="1" stop-color="#17469c"/>
    </linearGradient>
    <linearGradient id="huhuBelly" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fffdf4"/>
      <stop offset="1" stop-color="#ffedc2"/>
    </linearGradient>
    <linearGradient id="huhuBeak" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffb45e"/>
      <stop offset="1" stop-color="#ef7714"/>
    </linearGradient>
    <linearGradient id="huhuFoot" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffb45e"/>
      <stop offset="1" stop-color="#e27712"/>
    </linearGradient>
    <radialGradient id="huhuCheek" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#ff9fb5" stop-opacity="0.9"/>
      <stop offset="1" stop-color="#ff9fb5" stop-opacity="0"/>
    </radialGradient>
    <filter id="huhuShadow" x="-30%" y="-20%" width="160%" height="150%">
      <feDropShadow dx="0" dy="10" stdDeviation="9" flood-color="#0a2a66" flood-opacity="0.22"/>
    </filter>
  </defs>

  <ellipse cx="130" cy="284" rx="76" ry="11" fill="#0a2a66" opacity="0.13"/>

  <g>
    <!-- Telinga / jambul -->
    <path d="M67 88C53 70 47 46 46 34c0-3 3-5 6-3 16 8 31 19 42 33z" fill="#2f7bf6" stroke="#17469c" stroke-width="3" stroke-linejoin="round"/>
    <path d="M193 88c14-18 20-42 21-54 0-3-3-5-6-3-16 8-31 19-42 33z" fill="#2f7bf6" stroke="#17469c" stroke-width="3" stroke-linejoin="round"/>

    <!-- Badan -->
    <path d="M130 44c44 0 78 34 82 82 5 55-21 124-82 124S43 181 48 126c4-48 38-82 82-82z" fill="url(#huhuBody)" stroke="#17469c" stroke-width="3.4"/>

    <!-- Perut -->
    <ellipse cx="130" cy="182" rx="55" ry="69" fill="url(#huhuBelly)"/>
    <path d="M93 168c8-14 23-22 37-22s29 8 37 22" fill="none" stroke="#f3d99a" stroke-width="2.4" stroke-linecap="round" opacity="0.8"/>

    <!-- Sayap kiri -->
    <path d="M55 137c-20 10-31 34-28 56 2 15 12 27 25 30 9 2 15-4 14-13-1-9-6-15-6-27 0-12 3-23 8-34z" fill="url(#huhuWing)" stroke="#17469c" stroke-width="3" stroke-linejoin="round"/>
    <path d="M39 178c8-4 16-3 22 2M40 194c8-4 16-3 22 2" fill="none" stroke="#8dc0ff" stroke-width="2.4" stroke-linecap="round" opacity="0.65"/>

    <!-- Sayap kanan melambai -->
    <path d="M204 140c13-17 26-37 31-54 2-6-3-10-9-8-16 6-31 22-38 40-5 13-6 24-4 34 5 3 13 1 20-12z" fill="url(#huhuWing)" stroke="#17469c" stroke-width="3" stroke-linejoin="round"/>
    <path d="M208 121c7-10 14-19 22-26M200 134c6-2 12-1 17 2" fill="none" stroke="#8dc0ff" stroke-width="2.4" stroke-linecap="round" opacity="0.65"/>

    <!-- Kaki -->
    <path d="M96 236c-3 13-2 25 2 34 1 3 5 4 8 2 3-2 12-2 15 0 4 2 7 0 7-3 0-3-3-5-6-7-2-2-3-4-4-7 0-2-3-3-5-2-2 1-4 0-4-2 0-4 0-9-1-15z" fill="url(#huhuFoot)" stroke="#c9640b" stroke-width="2.4" stroke-linejoin="round"/>
    <path d="M164 236c3 13 2 25-2 34-1 3-5 4-8 2-3-2-12-2-15 0-4 2-7 0-7-3 0-3 3-5 6-7 2-2 3-4 4-7 0-2 3-3 5-2 2 1 4 0 4-2 0-4 0-9 1-15z" fill="url(#huhuFoot)" stroke="#c9640b" stroke-width="2.4" stroke-linejoin="round"/>

    <!-- Wajah -->
    <circle cx="101" cy="116" r="33" fill="#fffdf4" stroke="#17469c" stroke-width="3"/>
    <circle cx="159" cy="116" r="33" fill="#fffdf4" stroke="#17469c" stroke-width="3"/>
    <circle cx="104" cy="118" r="14" fill="#16305a"/>
    <circle cx="156" cy="118" r="14" fill="#16305a"/>
    <circle cx="108.5" cy="113" r="5" fill="#ffffff"/>
    <circle cx="160.5" cy="113" r="5" fill="#ffffff"/>
    <circle cx="99" cy="124" r="2.4" fill="#7fb1ff" opacity="0.9"/>
    <circle cx="151" cy="124" r="2.4" fill="#7fb1ff" opacity="0.9"/>

    <!-- Pipi -->
    <ellipse cx="72" cy="141" rx="15" ry="10" fill="url(#huhuCheek)"/>
    <ellipse cx="188" cy="141" rx="15" ry="10" fill="url(#huhuCheek)"/>

    <!-- Paruh -->
    <path d="m130 132 13 12-13 16-13-16z" fill="url(#huhuBeak)" stroke="#c9640b" stroke-width="2.4" stroke-linejoin="round"/>
    <path d="m130 140 6 5-6 7-6-7z" fill="#ffd7a1" opacity="0.7"/>

    <!-- Alis ramah -->
    <path d="M83 92c6-5 14-6 21-2M156 90c7-4 15-3 21 2" fill="none" stroke="#17469c" stroke-width="3" stroke-linecap="round" opacity="0.5"/>
  </g>

  <!-- Bintang kecil di dekat sayap -->
  <g>
    <path d="m238 67 3.1 6.3 7 1-5.1 4.9 1.2 7-6.2-3.3-6.2 3.3 1.2-7-5.1-4.9 7-1z" fill="#ffd23f" stroke="#e2a800" stroke-width="1.5" stroke-linejoin="round"/>
    <circle cx="250" cy="92" r="2.6" fill="#ffd23f"/>
    <circle cx="226" cy="87" r="1.8" fill="#ffd23f"/>
  </g>
</svg>
