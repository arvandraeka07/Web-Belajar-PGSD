<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 900" role="img" aria-label="Pemandangan luar angkasa dengan roket untuk puzzle">
  <defs>
    <linearGradient id="spaceBg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1636"/>
      <stop offset="0.5" stop-color="#142a5c"/>
      <stop offset="1" stop-color="#2a1a55"/>
    </linearGradient>
    <radialGradient id="nebulaA" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#6a4bff" stop-opacity="0.5"/>
      <stop offset="1" stop-color="#6a4bff" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="nebulaB" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#28c2ff" stop-opacity="0.38"/>
      <stop offset="1" stop-color="#28c2ff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="rocketBody" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#dfeeff"/>
      <stop offset="0.5" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#b9d4f7"/>
    </linearGradient>
    <linearGradient id="rocketNose" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ff9a3c"/>
      <stop offset="1" stop-color="#ef5b5b"/>
    </linearGradient>
    <linearGradient id="rocketFin" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ff9a3c"/>
      <stop offset="1" stop-color="#d96c0c"/>
    </linearGradient>
    <linearGradient id="flameGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff6b0"/>
      <stop offset="0.45" stop-color="#ffd23f"/>
      <stop offset="1" stop-color="#ff7a1a" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="planetOrange" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffd08a"/>
      <stop offset="0.55" stop-color="#ff9a3c"/>
      <stop offset="1" stop-color="#c95c10"/>
    </linearGradient>
    <linearGradient id="planetBlue" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#7fe8ff"/>
      <stop offset="0.55" stop-color="#2f9bf6"/>
      <stop offset="1" stop-color="#17469c"/>
    </linearGradient>
    <linearGradient id="windowGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#8fd8ff"/>
      <stop offset="1" stop-color="#2f7bf6"/>
    </linearGradient>
    <filter id="glow" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="18"/>
    </filter>
    <filter id="softShadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="12" stdDeviation="14" flood-color="#020a20" flood-opacity="0.45"/>
    </filter>
  </defs>

  <rect width="900" height="900" fill="url(#spaceBg)"/>
  <ellipse cx="220" cy="300" rx="300" ry="230" fill="url(#nebulaA)"/>
  <ellipse cx="710" cy="690" rx="320" ry="240" fill="url(#nebulaB)"/>
  <ellipse cx="620" cy="120" rx="220" ry="160" fill="url(#nebulaA)" opacity="0.55"/>

  <!-- Bintang-bintang -->
  <g fill="#ffffff">
    <circle cx="70" cy="70" r="3"/><circle cx="140" cy="40" r="2"/><circle cx="250" cy="90" r="2.5"/>
    <circle cx="340" cy="50" r="2"/><circle cx="500" cy="80" r="3"/><circle cx="600" cy="40" r="2"/>
    <circle cx="700" cy="60" r="2.5"/><circle cx="820" cy="110" r="2"/><circle cx="860" cy="40" r="3"/>
    <circle cx="60" cy="200" r="2"/><circle cx="110" cy="330" r="2.5"/><circle cx="300" cy="220" r="2"/>
    <circle cx="360" cy="330" r="2"/><circle cx="520" cy="190" r="2.5"/><circle cx="640" cy="260" r="3"/>
    <circle cx="860" cy="280" r="2.5"/><circle cx="810" cy="380" r="2"/><circle cx="70" cy="470" r="2.5"/>
    <circle cx="160" cy="560" r="2"/><circle cx="300" cy="520" r="2.5"/><circle cx="640" cy="500" r="2"/>
    <circle cx="720" cy="430" r="2.5"/><circle cx="860" cy="540" r="2"/><circle cx="80" cy="660" r="3"/>
    <circle cx="200" cy="760" r="2"/><circle cx="340" cy="830" r="2.5"/><circle cx="520" cy="760" r="2"/>
    <circle cx="660" cy="840" r="2.5"/><circle cx="820" cy="720" r="3"/><circle cx="870" cy="850" r="2"/>
  </g>
  <g stroke="#9fd0ff" stroke-width="2.4" stroke-linecap="round" opacity="0.9">
    <path d="M210 420v18M201 429h18"/>
    <path d="M600 340v14M593 347h14"/>
    <path d="M120 760v16M112 768h16"/>
    <path d="M760 300v14M753 307h14"/>
  </g>
  <g fill="#ffd23f">
    <path d="m410 120 4.6 9.4 10.4 1.5-7.5 7.3 1.8 10.3-9.3-4.9-9.3 4.9 1.8-10.3-7.5-7.3 10.4-1.5z"/>
    <path d="m780 470 3.6 7.4 8.2 1.2-5.9 5.8 1.4 8.1-7.3-3.8-7.3 3.8 1.4-8.1-5.9-5.8 8.2-1.2z" opacity="0.9"/>
    <path d="m240 700 3 6.2 6.8 1-4.9 4.8 1.2 6.7-6.1-3.2-6.1 3.2 1.2-6.7-4.9-4.8 6.8-1z" opacity="0.8"/>
  </g>

  <!-- Planet bercincin kiri atas -->
  <g transform="translate(175 205)">
    <ellipse cx="0" cy="0" rx="132" ry="42" fill="none" stroke="#ffcf87" stroke-width="13" opacity="0.55" transform="rotate(-24)"/>
    <ellipse cx="0" cy="0" rx="132" ry="42" fill="none" stroke="#ffe6b8" stroke-width="5" opacity="0.8" transform="rotate(-24)"/>
    <circle cx="0" cy="0" r="78" fill="url(#planetOrange)" stroke="#b9530c" stroke-width="4"/>
    <path d="M-74-18c32-12 74-14 143-6M-78 20c38 12 82 12 150 4M-52 48c28 8 62 8 100 2" fill="none" stroke="#d96c0c" stroke-width="6" opacity="0.45" stroke-linecap="round"/>
    <ellipse cx="-26" cy="-28" rx="18" ry="10" fill="#ffd9a8" opacity="0.55"/>
    <path d="M-132 0a132 42 0 0 0 264 0" fill="none" stroke="#ffcf87" stroke-width="13" opacity="0.75" transform="rotate(-24)"/>
  </g>

  <!-- Bulan kanan atas -->
  <g transform="translate(742 158)" filter="url(#softShadow)">
    <circle cx="0" cy="0" r="60" fill="#e8eef7" stroke="#9fb3cc" stroke-width="4"/>
    <circle cx="-18" cy="-16" r="13" fill="#c9d6e6"/>
    <circle cx="22" cy="10" r="18" fill="#d3dfec"/>
    <circle cx="-8" cy="32" r="8" fill="#c9d6e6"/>
    <circle cx="34" cy="-30" r="7" fill="#c9d6e6"/>
    <path d="M-42-38c10-10 24-15 38-13" fill="none" stroke="#ffffff" stroke-width="5" stroke-linecap="round" opacity="0.7"/>
  </g>

  <!-- Satelit kecil -->
  <g transform="translate(660 330) rotate(18)" opacity="0.95">
    <rect x="-14" y="-32" width="28" height="64" rx="7" fill="#dfe9f7" stroke="#8fa8c8" stroke-width="3"/>
    <rect x="-62" y="-20" width="34" height="40" rx="5" fill="#2f7bf6" stroke="#17469c" stroke-width="3"/>
    <rect x="28" y="-20" width="34" height="40" rx="5" fill="#2f7bf6" stroke="#17469c" stroke-width="3"/>
    <path d="M-62-10h34M-62 4h34M28-10h34M28 4h34" stroke="#8fd8ff" stroke-width="2"/>
    <path d="M0-32V-52" stroke="#8fa8c8" stroke-width="3"/>
    <circle cx="0" cy="-56" r="6" fill="#ffd23f" stroke="#e2a800" stroke-width="2"/>
  </g>

  <!-- Planet biru kanan bawah -->
  <g transform="translate(735 745)" filter="url(#softShadow)">
    <circle cx="0" cy="0" r="96" fill="url(#planetBlue)" stroke="#123f95" stroke-width="4"/>
    <path d="M-70-30c22-16 48-18 66-6 14 10 6 26-12 32-24 8-44-4-54-26z" fill="#5ee3a5" opacity="0.8"/>
    <path d="M10 30c26-12 52-4 62 14 6 12-6 24-24 24-24 0-42-16-38-38z" fill="#5ee3a5" opacity="0.7"/>
    <path d="M-84-10c20-8 40-8 58 0" fill="none" stroke="#bdf1ff" stroke-width="6" stroke-linecap="round" opacity="0.5"/>
    <ellipse cx="-30" cy="-38" rx="22" ry="12" fill="#bdf1ff" opacity="0.4"/>
  </g>

  <!-- Roket -->
  <g transform="rotate(-9 450 450)" filter="url(#softShadow)">
    <!-- Api -->
    <path d="M450 604c34 32 46 84 28 126-8 20-20 34-28 44-8-10-20-24-28-44-18-42-6-94 28-126z" fill="url(#flameGrad)"/>
    <path d="M450 618c18 22 24 54 14 82-4 12-10 21-14 27-4-6-10-15-14-27-10-28-4-60 14-82z" fill="#fff6b0"/>
    <path d="M450 646c7 12 9 28 5 43-1 5-3 9-5 12-2-3-4-7-5-12-4-15-2-31 5-43z" fill="#ffffff" opacity="0.9"/>

    <!-- Sirip -->
    <path d="M382 494c-30 16-54 52-60 104 20 4 42-2 62-14z" fill="url(#rocketFin)" stroke="#b9530c" stroke-width="4" stroke-linejoin="round"/>
    <path d="M518 494c30 16 54 52 60 104-20 4-42-2-62-14z" fill="url(#rocketFin)" stroke="#b9530c" stroke-width="4" stroke-linejoin="round"/>
    <path d="M414 566c-10 12-17 28-21 48 10 2 19 0 27-4zM486 566c10 12 17 28 21 48-10 2-19 0-27-4z" fill="#ffbe74" opacity="0.55"/>

    <!-- Badan -->
    <path d="M450 236c48 40 70 110 70 194v130c0 28-140 28-140 0V430c0-84 22-154 70-194z" fill="url(#rocketBody)" stroke="#8fa8c8" stroke-width="4" stroke-linejoin="round"/>
    <path d="M450 236c-30 25-50 64-60 112h120c-10-48-30-87-60-112z" fill="url(#rocketNose)" stroke="#c94b4b" stroke-width="4" stroke-linejoin="round"/>
    <rect x="380" y="486" width="140" height="26" fill="#ff9a3c" opacity="0.95"/>
    <rect x="380" y="512" width="140" height="8" fill="#ef5b5b" opacity="0.8"/>
    <path d="M380 564h140M380 584h140" stroke="#c4d9f2" stroke-width="3" opacity="0.7"/>
    <circle cx="410" cy="540" r="4" fill="#8fa8c8"/>
    <circle cx="490" cy="540" r="4" fill="#8fa8c8"/>

    <!-- Jendela -->
    <circle cx="450" cy="404" r="48" fill="#dfe9f7" stroke="#8fa8c8" stroke-width="5"/>
    <circle cx="450" cy="404" r="36" fill="url(#windowGrad)" stroke="#17469c" stroke-width="4"/>
    <path d="M428 390c8-10 22-16 34-14" fill="none" stroke="#ffffff" stroke-width="7" stroke-linecap="round" opacity="0.85"/>
    <circle cx="462" cy="416" r="5" fill="#bdf1ff" opacity="0.8"/>
  </g>

  <!-- Garis orbit dekoratif -->
  <ellipse cx="450" cy="470" rx="330" ry="150" fill="none" stroke="#7fa8ff" stroke-width="2" opacity="0.2" transform="rotate(-18 450 470)"/>

  <!-- Kompas bintang -->
  <g fill="none" stroke="#7fa8ff" stroke-width="2" opacity="0.35">
    <path d="M80 340l40 30 46-18 38 34"/>
    <path d="M620 620l38 22 40-12"/>
  </g>
</svg>
