<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 400" role="img" aria-label="Ilustrasi membaca buku">
  <defs>
    <linearGradient id="readBg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#eaf4ff"/>
      <stop offset="1" stop-color="#d8ebff"/>
    </linearGradient>
    <linearGradient id="readCover" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#4b8ffa"/>
      <stop offset="1" stop-color="#1a56c4"/>
    </linearGradient>
    <linearGradient id="readPage" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#f2f8ff"/>
    </linearGradient>
    <linearGradient id="readPencil" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffe26b"/>
      <stop offset="1" stop-color="#ffb020"/>
    </linearGradient>
    <filter id="readShadow" x="-20%" y="-20%" width="140%" height="160%">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#1a56c4" flood-opacity="0.16"/>
    </filter>
  </defs>

  <ellipse cx="322" cy="214" rx="270" ry="160" fill="url(#readBg)" opacity="0.85"/>
  <circle cx="500" cy="96" r="58" fill="#ffffff" opacity="0.55"/>
  <circle cx="130" cy="300" r="70" fill="#ffffff" opacity="0.38"/>
  <path d="M70 122c30-20 64-17 82 2" fill="none" stroke="#b9d8ff" stroke-width="4" stroke-linecap="round"/>

  <!-- Buku terbuka -->
  <g filter="url(#readShadow)">
    <path d="M104 250c74-36 154-40 216-12v114c-62-26-142-22-216 12z" fill="url(#readCover)"/>
    <path d="M536 250c-74-36-154-40-216-12v114c62-26 142-22 216 12z" fill="url(#readCover)"/>
    <path d="M128 238c66-29 136-32 192-7v96c-56-22-126-18-192 10z" fill="url(#readPage)" stroke="#cfe3ff" stroke-width="3" stroke-linejoin="round"/>
    <path d="M512 238c-66-29-136-32-192-7v96c56-22 126-18 192 10z" fill="url(#readPage)" stroke="#cfe3ff" stroke-width="3" stroke-linejoin="round"/>
    <path d="M320 232v96" stroke="#9cc4f8" stroke-width="4" stroke-linecap="round"/>
    <path d="M160 266c42-13 86-14 126-2M160 288c42-13 86-14 126-2M160 310c42-13 86-14 126-2" fill="none" stroke="#c7defb" stroke-width="6" stroke-linecap="round"/>
    <path d="M354 264c40-12 84-11 126 2M354 286c40-12 84-11 126 2M354 308c40-12 84-11 126 2" fill="none" stroke="#c7defb" stroke-width="6" stroke-linecap="round"/>
  </g>

  <!-- Huruf mengambang -->
  <g font-family="'Baloo 2','Trebuchet MS',sans-serif" font-weight="800" text-anchor="middle">
    <circle cx="146" cy="132" r="35" fill="#ffd23f" stroke="#e2a800" stroke-width="4"/>
    <text x="146" y="146" font-size="44" fill="#6b4c00">A</text>
    <circle cx="236" cy="88" r="28" fill="#ff9a3c" stroke="#d96c0c" stroke-width="4"/>
    <text x="236" y="99" font-size="34" fill="#ffffff">B</text>
    <circle cx="578" cy="300" r="34" fill="#2ecf7e" stroke="#159a58" stroke-width="4"/>
    <text x="578" y="314" font-size="42" fill="#ffffff">C</text>
    <circle cx="430" cy="70" r="24" fill="#8b5cf6" stroke="#6533d8" stroke-width="4"/>
    <text x="430" y="80" font-size="30" fill="#ffffff">a</text>
  </g>

  <!-- Pensil -->
  <g transform="rotate(33 448 202)" filter="url(#readShadow)">
    <rect x="432" y="88" width="30" height="118" rx="6" fill="url(#readPencil)" stroke="#c98f00" stroke-width="3"/>
    <rect x="432" y="88" width="30" height="20" rx="6" fill="#ff9fb5" stroke="#d96c8a" stroke-width="3"/>
    <path d="M432 206h30l-15 30z" fill="#ffe9c9" stroke="#c98f00" stroke-width="3" stroke-linejoin="round"/>
    <path d="m441 228 6 8 6-8z" fill="#16305a"/>
    <rect x="432" y="132" width="30" height="8" fill="#ffffff" opacity="0.55"/>
  </g>

  <!-- Bintang & hiasan -->
  <g fill="#ffd23f">
    <path d="m84 196 4 8.4 9.2 1.3-6.7 6.4 1.6 9.1-8.1-4.3-8.1 4.3 1.6-9.1-6.7-6.4 9.2-1.3z"/>
    <path d="m566 292 3 6.4 7 1-5.1 4.9 1.2 6.9-6.1-3.3-6.1 3.3 1.2-6.9-5.1-4.9 7-1z" opacity="0.9"/>
    <circle cx="590" cy="196" r="5"/>
    <circle cx="196" cy="196" r="4"/>
  </g>
  <g fill="none" stroke="#8bb8f5" stroke-width="4" stroke-linecap="round">
    <path d="M92 236c14-8 26-7 38 2M88 254c12-7 23-6 34 2"/>
    <path d="M540 224c12-8 24-8 36 0"/>
  </g>
</svg>
